name: Package

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run desktop:artifact

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dir="$(find release -maxdepth 1 -type d -name 'Artmatic-*' | sort | tail -n1)"
          test -n "$dir"
          tar -C release -czf "artmatic-linux-x64-${version}.tar.gz" "$(basename "$dir")"
          tar -C dist -czf "artmatic-web-${version}.tar.gz" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $dir = Get-ChildItem release -Directory -Filter 'Artmatic-*' | Sort-Object Name | Select-Object -Last 1
          if (-not $dir) { throw 'desktop:artifact produced no directory' }
          Compress-Archive -Path $dir.FullName -DestinationPath "artmatic-windows-x64-$version.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: |
            artmatic-*.tar.gz
            artmatic-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: release-assets

      - name: Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
